<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Francesco Durazzo</title>
<meta name="description" content="Francesco Durazzo, author of Agência de Detetives Grandes Galerias Ltda.">
<style>
  :root { --ink: #1a1a1a; --paper: #f7f5f0; --muted: #6b6b6b; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --paper: #161616; --muted: #9a9a9a; } }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, "Times New Roman", serif; padding: 0 16px; }
  main { text-align: center; max-width: 36rem; }
  h1 { font-weight: normal; font-size: clamp(2rem, 6vw, 3.5rem); margin: 0; }
  .book { font-style: italic; font-size: 1.25rem; margin: 1.5rem 0 0; }
  .imprint { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.15em; text-transform: uppercase; margin: 2.5rem 0 0; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Francesco Durazzo</h1>
  <p class="book" lang="pt-BR">Agência de Detetives Grandes Galerias Ltda.</p>
  <p class="imprint"><a href="https://porchesterpublishing.com">Porchester Publishing</a></p>
</main>
</body>
</html>
